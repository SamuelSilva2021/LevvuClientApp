name: levvu_client
description: "Aplicativo Levvu para solicitação de fretes"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  intl: ^0.18.1
  image_picker: ^1.0.2
  url_launcher: ^6.1.12
  mask_text_input_formatter: ^2.9.0
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_places_flutter: ^2.0.6
  flutter_dotenv: ^5.1.0
  flutter_svg: ^2.0.9
  flutter_google_places: ^0.3.0
  google_maps_webservice: ^0.0.20-nullsafety.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env.development
    - .env.production

  